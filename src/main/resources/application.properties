server.port=8080
server.servlet.context-path=/

spring.application.name=employee-leave-management

# Default profile: dev (H2 in-memory), mysql (local MySQL), render (Render PostgreSQL)
# On Render, set env var: SPRING_PROFILES_ACTIVE=render
# Locally override with: --spring.profiles.active=mysql
spring.profiles.active=mysql

# JWT Settings - On Render, APP_JWT_SECRET env var overrides this default
app.jwt.secret=${APP_JWT_SECRET:9a3f2c4e6b8a1d0f5e7c9b3a1d8f2e4c6a8b0d2e4f6a8b1c3d5e7f9a1b3c5d7e}
app.jwt.expiration-ms=${APP_JWT_EXPIRATION_MS:86400000}

# Logging
logging.level.com.elm.system=INFO
logging.level.org.springframework.security=WARN
