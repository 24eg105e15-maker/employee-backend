# ============================================================
# Render.com Production Profile - PostgreSQL
# All sensitive values are injected via Render Environment Variables
# ============================================================

# Render provides DATABASE_URL as: postgresql://user:password@host:port/dbname
# We prefix with jdbc: so Spring Boot accepts it as a JDBC URL
spring.datasource.url=jdbc:${DATABASE_URL}
spring.datasource.driver-class-name=org.postgresql.Driver

# Explicitly exclude H2 auto-configuration to prevent fallback
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.h2.H2ConsoleAutoConfiguration

# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# Server port (Render injects PORT env var)
server.port=${PORT:8080}

# Logging
logging.level.com.elm.system=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate=WARN