# ============================================================
# Render.com Production Profile - PostgreSQL
# Uses individual DB params to avoid URL parsing issues
# ============================================================

# Individual connection params (set each as env var in Render dashboard)
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Explicitly exclude H2 auto-configuration
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.h2.H2ConsoleAutoConfiguration

# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# Server port (Render injects PORT env var)
server.port=${PORT:8080}

# Logging
logging.level.com.elm.system=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate=WARN