services:
  - type: web
    name: employee-leave-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/auth/health
    plan: free
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: render
      - key: DATABASE_URL
        fromDatabase:
          name: employee-leave-db
          property: connectionString
      - key: APP_JWT_SECRET
        generateValue: true
      - key: APP_JWT_EXPIRATION_MS
        value: 86400000

databases:
  - name: employee-leave-db
    databaseName: employee_leave_db
    plan: free

